# Optional observability stack for Rationale.AI.
#
# The app itself never depends on this — it exposes /metrics on :9108 and keeps
# working whether or not anything scrapes it.
#
#   cd ops && docker compose up -d
#   Grafana    http://localhost:3000   (anonymous, dashboard pre-provisioned)
#   Prometheus http://localhost:9090
#
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: rationale-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Streamlit app on the host

  grafana:
    image: grafana/grafana:latest
    container_name: rationale-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/rationale.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

# Streamlit Community Cloud puts free apps to sleep after ~12 hours without
# traffic. This visits the demo every 4 hours so it never crosses that line.
# (If the app is ALREADY asleep, waking it needs one click of the "get this app
# back up" button in a browser — this ping only prevents sleep, it can't press
# the button.)
name: Keep the demo app awake

on:
  schedule:
    - cron: "0 */4 * * *"     # every 4 hours, UTC
  workflow_dispatch: {}        # manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the hosted app
        run: |
          curl -sS -o /dev/null -w "app responded: HTTP %{http_code}\n" \
               --max-time 90 https://rationale-ai-acc.streamlit.app/ || true
